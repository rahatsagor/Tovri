version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      swift:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /scripts
    schedule:
      interval: weekly
    groups:
      release-tools:
        patterns: ["*"]
